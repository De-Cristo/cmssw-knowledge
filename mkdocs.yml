site_name: CMSSW Knowledge Base
site_description: A learning-oriented guide to CMSSW architecture, subsystems, and workflows
site_url: https://de-cristo.github.io/cmssw-knowledge/

repo_url: https://github.com/De-Cristo/cmssw-knowledge
repo_name: De-Cristo/cmssw-knowledge
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Project:
      - Knowledge charter: about/knowledge-charter.md
  - Learn:
      - Learning path: learn/index.md
      - Timing curriculum: learn/timing-curriculum.md
      - The CMSSW big picture: learn/01-big-picture.md
  - Timing:
      - Timing in CMSSW: timing/index.md
      - Product and persistence inventory: timing/inventory.md
  - Architecture:
      - Overview: architecture/index.md
  - Workflows:
      - Overview: workflows/index.md
  - Subsystems:
      - Overview: subsystems/index.md
  - Debugging:
      - Overview: debugging/index.md
  - Reference:
      - Verification snapshot: reference/verification-snapshot.md
  - Glossary: glossary.md
  - Contributing: contributing.md

copyright: Personal CMSSW study notes — verify technical claims against the referenced CMSSW revision.
